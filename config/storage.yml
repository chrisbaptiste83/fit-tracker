test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# Google Cloud Storage — Fornax Stack object storage layer (GCS for GCP-deployed apps).
# Bucket naming convention: {project}-{purpose}-{env}
# Authentication is provided automatically by the GCP metadata server via Workload Identity.
# No long-lived service-account JSON keys are stored in ENV or the repo.
google:
  service: GCS
  project: trinitas-forge
  bucket: fit-tracker-uploads-<%= Rails.env %>
