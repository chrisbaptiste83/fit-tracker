name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write

env:
  RUBY_VERSION: "3.4.2"
  GCP_PROJECT: fornax-apps
  GCP_REGION: us-central1
  SERVICE: fit-tracker-prod
  REGISTRY: us-central1-docker.pkg.dev/fornax-apps/fit-tracker

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Install bundler-audit
        run: gem install bundler-audit
      - name: Update advisory database
        run: bundle-audit update
      - name: Run bundle audit
        run: bundle-audit check
      - name: Run yarn audit
        if: hashFiles('yarn.lock') != ''
        run: yarn audit --level moderate

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rails
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fit_tracker_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      RAILS_ENV: test
      DATABASE_URL: postgres://rails:postgres@localhost:5432/fit_tracker_test
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ env.RUBY_VERSION }}
          bundler-cache: true
      - name: Prepare database
        run: bin/rails db:test:prepare
      - name: Run tests
        run: bin/rails test

  build-and-deploy:
    needs: [audit, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT }}
      - name: Configure Docker
        run: gcloud auth configure-docker ${{ env.GCP_REGION }}-docker.pkg.dev --quiet
      - name: Build and push
        run: |
          docker build -t ${{ env.REGISTRY }}:${{ github.sha }} .
          docker push ${{ env.REGISTRY }}:${{ github.sha }}
      - name: Deploy to Cloud Run
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.GCP_REGION }}
          image: ${{ env.REGISTRY }}:${{ github.sha }}
