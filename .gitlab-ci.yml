stages:
  - test
  - build
  - deploy

variables:
  FF_NETWORK_PER_BUILD: "true"
  PROJECT_ID: trinitas-forge
  REGION: us-west1
  SERVICE: fit-tracker
  IMAGE: us-west1-docker.pkg.dev/trinitas-forge/app-images/fit-tracker

# ── Test ──────────────────────────────────────────────────────────────────────

test:
  stage: test
  image: ruby:3.4.2-slim
  services:
    - name: postgres:16-alpine
      alias: postgres
  variables:
    POSTGRES_DB: fit_tracker_test
    POSTGRES_USER: postgres
    POSTGRES_PASSWORD: postgres
    DATABASE_URL: postgresql://postgres:postgres@postgres/fit_tracker_test
    RAILS_ENV: test
    BUNDLE_WITHOUT: ""
  before_script:
    - apt-get update -qq && apt-get install -y build-essential libpq-dev nodejs git libyaml-dev
    - gem install bundler --no-document
    - bundle install --jobs 4 --retry 3
    - bundle exec rails db:test:prepare
  script:
    - bundle exec rails test
    - bundle exec brakeman -q --no-pager
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

# ── Build ─────────────────────────────────────────────────────────────────────

build:
  stage: build
  image: google/cloud-sdk:slim
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apt-get update -qq && apt-get install -y docker.io
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - gcloud auth configure-docker us-west1-docker.pkg.dev --quiet
    - gcloud config set project $PROJECT_ID
  script:
    - export DOCKER_BUILDKIT=1
    - docker build -t $IMAGE:$CI_COMMIT_SHA -t $IMAGE:latest .
    - docker push $IMAGE:$CI_COMMIT_SHA
    - docker push $IMAGE:latest
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

# ── Deploy ────────────────────────────────────────────────────────────────────

deploy:
  stage: deploy
  image: google/cloud-sdk:slim
  before_script:
    - gcloud auth activate-service-account --key-file="$GCP_SA_KEY"
    - gcloud config set project $PROJECT_ID
  script:
    - |
      gcloud run deploy $SERVICE \
        --image $IMAGE:$CI_COMMIT_SHA \
        --region $REGION \
        --project $PROJECT_ID \
        --service-account fit-tracker-service@${PROJECT_ID}.iam.gserviceaccount.com \
        --vpc-connector run-to-vpc \
        --vpc-egress private-ranges-only \
        --port 8080 \
        --cpu 1 \
        --memory 1Gi \
        --no-cpu-throttling \
        --cpu-boost \
        --min-instances 1 \
        --max-instances 20 \
        --allow-unauthenticated \
        --set-env-vars=RAILS_ENV=production,RAILS_LOG_LEVEL=info,SOLID_QUEUE_IN_PUMA=true,WEB_CONCURRENCY=1,RAILS_MAX_THREADS=10 \
        --set-secrets=RAILS_MASTER_KEY=fit-tracker-rails-master-key:latest,DATABASE_URL=fit-tracker-database-url:latest,QUEUE_DATABASE_URL=fit-tracker-queue-database-url:latest,REDIS_URL=fit-tracker-redis-url:latest \
        --quiet
  environment:
    name: production
    url: https://fit-tracker-o3clvemm7a-uw.a.run.app
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
